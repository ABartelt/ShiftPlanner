server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # runtime configuration, customization and the service worker are never cached by the browser
    location = /config.json          { add_header Cache-Control "no-cache"; types { } default_type application/json; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /registerSW.js        { add_header Cache-Control "no-cache"; }
    location /customization/         { add_header Cache-Control "no-cache"; }

    # hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback (web history)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
