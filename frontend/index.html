<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/customization/favicon.png" />
    <link rel="apple-touch-icon" href="/customization/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/customization/customization.css" />
    <script>
      // Apply the stored theme before the first paint; src/composables/useTheme.ts takes over after boot.
      ;(function () {
        var preference = null
        try {
          preference = localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#000000' : '#ffffff')
        // iOS only reads this when the home-screen app starts, so it follows the theme on next launch.
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          .setAttribute('content', dark ? 'black-translucent' : 'default')
      })()
    </script>
    <title>Schichtplaner</title>
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
