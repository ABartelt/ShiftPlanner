services:
  shift-planner-api:
    restart: unless-stopped
    image: ghcr.io/muddi-markt/shiftplanner/api:v1.8
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - shiftplanner
    ports:
      - "5280:8080"
    environment:
      Database__USER: ${SHIFT_PLANNER_POSTGRES_USER}
      Database__PASSWORD: ${SHIFT_PLANNER_POSTGRES_PASSWORD}
      Database__Name: ${SHIFT_PLANNER_POSTGRES_DB}
      Database__HOST: postgres
      Database__PORT: 5432
      MuddiConnect__Authority: http://keycloak:8080/realms/${SHIFT_PLANNER_KEYCLOAK_REALM}
      MuddiConnect__ClientId: ${SHIFT_PLANNER_CLIENT_ID}
      MuddiConnect__ClientSecret: ${SHIFT_PLANNER_CLIENT_SECRET}
      Cors__Origins__0: ${SHIFT_PLANNER_CLIENT_URL}
      # Shift reminders: a channel is offered to users only when its handle is set (see shift-planner-alerting)
      Notifications__Telegram__BotUsername: ${SHIFT_PLANNER_TELEGRAM_BOT_USERNAME:-}
      Notifications__WhatsApp__Number: ${SHIFT_PLANNER_WHATSAPP_NUMBER:-}
      Notifications__Signal__Number: ${SHIFT_PLANNER_SIGNAL_NUMBER:-}
      Notifications__Email__Enabled: ${SHIFT_PLANNER_EMAIL_ENABLED:-false}
  shift-planner-client:
    restart: unless-stopped
    image: ghcr.io/muddi-markt/shiftplanner/client:v1.8
    environment:
      SHIFT_PLANNER_KEYCLOAK_URL: ${SHIFT_PLANNER_KEYCLOAK_URL}
      SHIFT_PLANNER_KEYCLOAK_REALM: ${SHIFT_PLANNER_KEYCLOAK_REALM}
      SHIFT_PLANNER_API_URL: ${SHIFT_PLANNER_API_URL}
    volumes:
      - ./config/muddi/customization:/usr/share/nginx/html/customization
      - ./config/muddi/manifest.json:/usr/share/nginx/html/manifest.json
    networks:
      - shiftplanner
    ports:
      - "5281:80"

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.4
    # "start" (not "start --optimized"): a fresh container must do its first-ever
    # optimized build itself, which "--optimized" skips and fails on.
    command: start
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded 
      
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      # Persistent data dir: keeps the optimized build (and keycloak state) across
      # container recreation, so boots are not "first ever start" anymore.
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "28080:8080" # only for local testing
    networks:
      - shiftplanner
      
  postgres:
    image: postgres:14
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ChangeMeBetterNow
      SHIFT_PLANNER_POSTGRES_USER: ${SHIFT_PLANNER_POSTGRES_USER}
      SHIFT_PLANNER_POSTGRES_PASSWORD: ${SHIFT_PLANNER_POSTGRES_PASSWORD}
      SHIFT_PLANNER_POSTGRES_DB: ${SHIFT_PLANNER_POSTGRES_DB}
      KEYCLOAK_POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgres/data
      - ./config/postgres/initdb:/docker-entrypoint-initdb.d
    networks:
      - shiftplanner
    ports:
      - "25432:5432"

  # Sends shift reminders via Telegram / WhatsApp / Signal / e-mail. Opt-in:
  #   docker compose --profile notifications up -d
  # Fill in the channels you want in .env; channels without credentials stay off.
  shift-planner-alerting:
    restart: unless-stopped
    image: ghcr.io/muddi-markt/shiftplanner/alerting:v1.8
    profiles:
      - notifications
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shiftplanner
    ports:
      # Twilio webhook and the e-mail release/unsubscribe pages; expose via your reverse proxy as SHIFT_PLANNER_ALERTING_URL
      - "5282:8080"
    environment:
      Database__USER: ${SHIFT_PLANNER_POSTGRES_USER}
      Database__PASSWORD: ${SHIFT_PLANNER_POSTGRES_PASSWORD}
      Database__Name: ${SHIFT_PLANNER_POSTGRES_DB}
      Database__HOST: postgres
      Database__PORT: 5432
      MuddiShiftClient__BaseUrl: ${SHIFT_PLANNER_CLIENT_URL}
      Notifications__PublicBaseUrl: ${SHIFT_PLANNER_ALERTING_URL:-}
      Telegram__ApiToken: ${SHIFT_PLANNER_TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${SHIFT_PLANNER_TELEGRAM_BOT_USERNAME:-}
      Twilio__AccountSid: ${SHIFT_PLANNER_TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${SHIFT_PLANNER_TWILIO_AUTH_TOKEN:-}
      Twilio__WhatsAppFrom: ${SHIFT_PLANNER_WHATSAPP_NUMBER:-}
      Signal__BaseUrl: ${SHIFT_PLANNER_SIGNAL_API_URL:-}
      Signal__Number: ${SHIFT_PLANNER_SIGNAL_NUMBER:-}
      Smtp__Host: ${SHIFT_PLANNER_SMTP_HOST:-}
      Smtp__Port: ${SHIFT_PLANNER_SMTP_PORT:-587}
      Smtp__User: ${SHIFT_PLANNER_SMTP_USER:-}
      Smtp__Password: ${SHIFT_PLANNER_SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SHIFT_PLANNER_SMTP_FROM:-}

volumes:
  postgres_data:
  keycloak_data:

networks:
  shiftplanner: